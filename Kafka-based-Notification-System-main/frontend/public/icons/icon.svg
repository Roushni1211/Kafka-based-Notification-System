<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="gBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285F4"/>
      <stop offset="100%" stop-color="#1967D2"/>
    </linearGradient>
    <linearGradient id="gRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA4335"/>
      <stop offset="100%" stop-color="#C5221F"/>
    </linearGradient>
    <linearGradient id="gYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBC04"/>
      <stop offset="100%" stop-color="#F29900"/>
    </linearGradient>
    <linearGradient id="gGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34A853"/>
      <stop offset="100%" stop-color="#137333"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background rounded squircle (Google Style) -->
  <rect width="512" height="512" rx="128" fill="#131314" filter="url(#shadow)"/>
  
  <!-- Outer glowing ring / badge -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>

  <!-- Chat Bubble Group (Google 4-Colors Interconnected) -->
  <!-- Blue Primary Chat Bubble -->
  <path d="M120 160 C120 130, 144 106, 174 106 L338 106 C368 106, 392 130, 392 160 L392 280 C392 310, 368 334, 338 334 L210 334 L140 394 L140 334 L174 334 C144 334, 120 310, 120 280 Z" fill="url(#gBlue)"/>

  <!-- Google 4-Color Accents inside the bubble -->
  <!-- Yellow Accent -->
  <circle cx="200" cy="220" r="28" fill="url(#gYellow)"/>
  <!-- Red Accent -->
  <circle cx="256" cy="220" r="28" fill="url(#gRed)"/>
  <!-- Green Accent -->
  <circle cx="312" cy="220" r="28" fill="url(#gGreen)"/>

  <!-- Google "C" stylized badge on top right -->
  <g transform="translate(320, 260)">
    <circle cx="64" cy="64" r="54" fill="#FFFFFF" filter="url(#shadow)"/>
    <path d="M 64 30 A 34 34 0 0 1 88 43 L 73 57 A 17 17 0 0 0 64 51 A 17 17 0 1 0 78 74 L 95 86 A 34 34 0 1 1 64 30 Z" fill="#4285F4"/>
    <circle cx="78" cy="74" r="6" fill="#34A853"/>
  </g>
</svg>
